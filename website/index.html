<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rship — Cloud sync, engineered in Rust</title>
    <meta
      name="description"
      content="Move millions of files across 10 clouds in Rust with <= 64 MiB RSS, SQLite WAL crash-resumption, and seekable STREAM OAE2 encryption."
    />
    <meta name="theme-color" content="#FF5E1A" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo-120.png" />
    <!--app-head-->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('rship-theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
