name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Build releases with the stable toolchain the matrix installs (including
  # cross targets), not the MSRV pinned in rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: stable

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: tar.gz
            bin: rship
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: tar.gz
            bin: rship
            musl: true
          - os: macos-15
            target: aarch64-apple-darwin
            ext: tar.gz
            bin: rship
            musl: false
          - os: macos-15
            target: x86_64-apple-darwin
            ext: tar.gz
            bin: rship
            musl: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            bin: rship.exe
            musl: false

    steps:
      - uses: actions/checkout@v5

      - name: Install musl tools and kernel UAPI headers (Linux static build)
        if: matrix.musl == true
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools musl-dev
          ARCH="$(uname -m)"
          MUSL_INC="/usr/include/${ARCH}-linux-musl"
          for hdr in linux asm-generic; do
            if [ ! -e "${MUSL_INC}/${hdr}" ] && [ -d "/usr/include/${hdr}" ]; then
              sudo ln -s "/usr/include/${hdr}" "${MUSL_INC}/${hdr}"
            fi
          done
          if [ ! -e "${MUSL_INC}/asm" ] && [ -d "/usr/include/${ARCH}-linux-gnu/asm" ]; then
            sudo ln -s "/usr/include/${ARCH}-linux-gnu/asm" "${MUSL_INC}/asm"
          fi
          TARGET_ENV="$(printf '%s' '${{ matrix.target }}' | tr '-' '_')"
          echo "CC_${TARGET_ENV}=musl-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p rship-cli --target ${{ matrix.target }}

      - name: Verify static musl linkage and smoke-test binary (Linux)
        if: matrix.musl == true
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          file "$BIN"
          NEEDED="$(readelf -d "$BIN" 2>/dev/null | grep -E '\(NEEDED\)' || true)"
          INTERP="$(readelf -l "$BIN" 2>/dev/null | grep -i 'program interpreter' || true)"
          if [ -n "$NEEDED" ] || [ -n "$INTERP" ]; then
            echo "ERROR: expected fully static musl binary without DT_NEEDED or PT_INTERP:" >&2
            [ -n "$NEEDED" ] && echo "$NEEDED" >&2
            [ -n "$INTERP" ] && echo "$INTERP" >&2
            exit 1
          fi
          "$BIN" --version

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="rship-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${STAGE}/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          rm -rf "dist/${STAGE}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $stage = "rship-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$stage/"
          Copy-Item README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip" -Force
          Remove-Item -Recurse -Force "dist/$stage"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: rship-${{ matrix.target }}
          path: dist/*.${{ matrix.ext }}

  build-linux-gnu:
    name: Build ${{ matrix.target }} (glibc <= 2.28)
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64

    steps:
      - uses: actions/checkout@v5

      - name: Install rustup (container)
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary (glibc <= 2.28)
        run: cargo build --release --locked -p rship-cli --target ${{ matrix.target }}

      - name: Verify glibc <= 2.28 linkage and smoke-test binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/rship"
          ldd "$BIN"
          VERSIONS="$(readelf --version-info "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -uV || true)"
          echo "Required GLIBC symbol versions:"
          echo "$VERSIONS"
          MAX_VER="$(printf '%s\n' "$VERSIONS" | sed 's/^GLIBC_//' | tail -n 1)"
          if [ -z "$MAX_VER" ]; then
            echo "ERROR: failed to extract GLIBC symbol versions from $BIN via readelf" >&2
            exit 1
          fi
          if [ "$(printf '%s\n2.28\n' "$MAX_VER" | sort -V | tail -n 1)" != "2.28" ]; then
            echo "ERROR: binary requires GLIBC_${MAX_VER}, exceeding 2.28 compatibility ceiling" >&2
            exit 1
          fi
          "$BIN" --version

      - name: Package Unix archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="rship-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/rship" "dist/${STAGE}/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          rm -rf "dist/${STAGE}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: rship-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [ci, build, build-linux-gnu]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
